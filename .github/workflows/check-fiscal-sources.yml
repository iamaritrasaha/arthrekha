name: Check official fiscal sources

on:
  workflow_dispatch:

permissions:
  contents: read
  # NOTE: This workflow was the original monolithic auto-commit workflow.
  # Phase 4 of CGA_REFRESH_PLAN.md stripped all auto-commit/deploy steps.
  # Detection is now handled by detect.yml; refresh by refresh.yml.
  # Only read access is needed to run check_updates.py and upload an artifact.

concurrency:
  group: fiscal-source-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check the official CGA release index
        id: source-check
        run: |
          PYTHONPATH=. python -m pipeline.scripts.check_updates --report-path source-update-report.json

      - name: Add source status to the run summary
        if: always()
        run: |
          if [ -f source-update-report.json ]; then
            {
              echo '### Official source status'
              echo
              echo '```json'
              cat source-update-report.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Preserve the source report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fiscal-source-report
          path: source-update-report.json
          if-no-files-found: error
