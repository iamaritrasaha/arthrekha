name: Check official fiscal sources

on:
  schedule:
    - cron: '20 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fiscal-source-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check the official CGA release index
        id: source-check
        run: |
          PYTHONPATH=. python -m pipeline.scripts.check_updates --report-path source-update-report.json

      - name: Add source status to the run summary
        if: always()
        run: |
          if [ -f source-update-report.json ]; then
            {
              echo '### Official source status'
              echo
              echo '```json'
              cat source-update-report.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Preserve the source report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fiscal-source-report
          path: source-update-report.json
          if-no-files-found: error

      - name: Fetch and normalize a newer CGA report
        if: steps.source-check.outputs.status == 'new_release'
        env:
          REPORTING_PERIOD: ${{ steps.source-check.outputs.reporting_period }}
          REPORT_URL: ${{ steps.source-check.outputs.report_url }}
        run: |
          report_end="${REPORTING_PERIOD##*-}"
          PYTHONPATH=. python -m pipeline.scripts.refresh_cga \
            --report-url "$REPORT_URL" \
            --output "datasets/raw/cga_2026-27_${report_end}.json"

      - name: Install Python validation dependencies
        if: steps.source-check.outputs.status == 'new_release'
        run: python -m pip install -r requirements-dev.txt

      - name: Install frontend dependencies for candidate validation
        if: steps.source-check.outputs.status == 'new_release'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend packages
        if: steps.source-check.outputs.status == 'new_release'
        run: npm ci

      - name: Regenerate and validate the candidate dataset
        if: steps.source-check.outputs.status == 'new_release'
        run: |
          PYTHONPATH=. python -m pipeline.scripts.ingest
          PYTHONPATH=. python -m pytest -q
          python3 run_tests.py
          npm test -- --run
          npm run typecheck
          npm run lint
          npm run build

      - name: Publish validated dataset refresh
        if: steps.source-check.outputs.status == 'new_release'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "datasets/raw/cga_2026-27_${REPORTING_PERIOD##*-}.json" \
            datasets/processed/union/budget-summary-2026-27.json \
            datasets/metadata/sources.json
          git commit -m "Refresh CGA actuals through ${{ steps.source-check.outputs.reporting_period }}"
          git push origin main
        env:
          REPORTING_PERIOD: ${{ steps.source-check.outputs.reporting_period }}
